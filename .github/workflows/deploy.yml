name: Deploy Kilatech.ma to Hostinger (FTP - No SSH)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────────────────────
      # FRONTEND — Build Vue.js + Upload via FTP
      # ──────────────────────────────────────────────────────────────
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🛠️ Build Frontend (Vue.js)
        run: |
          cd frontend
          npm install
          npm run build

      - name: 🛠️ Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: 🚀 Deploy Frontend to Hostinger
        run: |
          lftp -e "set ftp:ssl-allow no; set net:timeout 30; set net:max-retries 3; mirror -R --delete-first=false ./frontend/dist/ /; quit" -u "${{ secrets.FTP_USER }}","${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_HOST }}"

      # ──────────────────────────────────────────────────────────────
      # BACKEND — Install Composer + Upload via FTP
      # ──────────────────────────────────────────────────────────────
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: 📦 Install Composer Dependencies
        run: |
          cd backend
          composer install --no-dev --optimize-autoloader --no-interaction

      - name: 🚀 Deploy Backend (Laravel) to Hostinger
        run: |
          lftp -e "set ftp:ssl-allow no; set net:timeout 30; set net:max-retries 3; mirror -R -x '^\.git/' -x '^node_modules/' -x '^storage/logs/' -x '^storage/framework/cache/' -x '^storage/framework/sessions/' -x '^storage/framework/views/' -x '^\.env$' -x '^tests/' ./backend/ /api/; quit" -u "${{ secrets.FTP_USER }}","${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_HOST }}"
